<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#F7FAF8">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تفاصيل الأجهزة المنزلية | مؤسسة ال بكار</title>
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:site_name" content="مؤسسة ال بكار">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:type" content="website">
  <meta property="og:title" content="تفاصيل الأجهزة المنزلية | مؤسسة ال بكار">
  <meta property="og:description" content="اكتشف تفاصيل وأسعار الأجهزة المنزلية من مؤسسة ال بكار، وتحقق من المواصفات والتوفر قبل إتمام طلبك أونلاين.">
  <meta property="og:image" content="https://al-bakar.web.app/assets/images/refrigerator.jpg">

  <meta name="description" content="اكتشف تفاصيل وأسعار الأجهزة المنزلية من مؤسسة ال بكار، وتحقق من المواصفات والتوفر قبل إتمام طلبك أونلاين.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="products.css">
  <link rel="stylesheet" href="animations.css">
  <link rel="stylesheet" href="bottom-nav.css">

  <style>
    /* =========================================
       1. PREMIUM DESIGN SYSTEM (Charcoal, Gold, Burgundy)
    ========================================= */
    :root {
      --bg-base: #0a0a0a !important;        
      --bg-surface: #141414 !important;     
      --bg-elevated: #1e1e1e !important;    
      
      --gold-primary: #D4AF37 !important;   
      --gold-hover: #b5952f !important;
      
      --burgundy: #800020 !important;       
      --silver: #A0A0A0 !important;         
      
      --text-main: #ffffff !important;      
      --text-muted: #888888 !important;     
      
      --border-dark: #2a2a2a !important;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      
      --transition-fast: 0.2s ease;
      --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body.product-detail-body { padding-bottom: var(--bakar-nav-clearance); }

    /* Glass Header */
    .site-header {
      background: rgba(10, 10, 10, 0.8) !important;
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-dark) !important;
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 0;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-main) !important; text-decoration: none; }
    .logo span { color: var(--gold-primary); }
    .header-actions { display: flex; gap: 20px; }
    .icon-btn { background: none; border: none; color: var(--text-main) !important; font-size: 1.4rem; position: relative; cursor: pointer; text-decoration: none; transition: var(--transition-fast); }
    .icon-btn:hover { color: var(--gold-primary) !important; }
    .cart-badge-premium { position: absolute; top: -6px; right: -8px; background: var(--burgundy); color: #fff; font-size: 0.7rem; font-weight: 800; min-width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-base); }

    /* =========================================
       2. LAYOUT (Gallery 55% / Info 45%)
    ========================================= */
    .product-detail-page { width: 100%; min-width: 0; padding: 40px 0 100px; }
    .product-detail-container { width: 100%; max-width: 1400px; min-width: 0; margin: 0 auto; padding: 0 clamp(12px, 3vw, 20px); }
    
    .product-detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(320px, 0.88fr);
      gap: clamp(24px, 4vw, 56px);
      align-items: start;
    }

    @media (max-width: 992px) {
      .product-detail-layout {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }

    /* =========================================
       3. PRODUCT GALLERY (Main + Thumbnails)
    ========================================= */
    .gallery-section {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: sticky;
      top: 100px;
    }

    .main-image-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-xl);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      perspective: 1000px;
      touch-action: pan-y;
    }

    .main-image-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .main-image-wrapper img {
      width: 85%;
      height: 85%;
      object-fit: contain;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
      transition: opacity var(--transition-smooth), transform var(--transition-smooth);
      user-select: none;
      -webkit-user-drag: none;
    }

    .gallery-counter {
      position: absolute;
      inset-inline-start: 12px;
      bottom: 12px;
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(10,10,10,.72);
      color: #fff;
      font-size: .78rem;
      line-height: 1.4;
      direction: ltr;
      pointer-events: none;
    }

    .gallery-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 12px;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 0;
      background: #777;
      cursor: pointer;
      transition: width var(--transition-fast), background var(--transition-fast);
    }

    .gallery-dot.active { width: 22px; background: var(--gold-primary); }
    .gallery-dot:focus-visible { outline: 2px solid var(--gold-primary); outline-offset: 3px; }

    .thumbnails-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 5px;
      scroll-snap-type: x proximity;
    }
    .thumbnails-container::-webkit-scrollbar { display: none; }

    .thumbnail-box {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      padding: 10px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
    }
    .thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .thumbnail-box.active {
      border-color: var(--gold-primary);
      background: var(--bg-elevated);
    }
    .thumbnail-box:hover:not(.active) {
      border-color: var(--silver);
    }

    /* =========================================
       4. FULLSCREEN LIGHTBOX
    ========================================= */
    .lightbox-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-smooth);
      touch-action: pan-y;
    }
    .lightbox-overlay.active { opacity: 1; visibility: visible; }
    
    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      transform: scale(0.9);
      transition: transform var(--transition-smooth);
      user-select: none;
      -webkit-user-drag: none;
    }
    .lightbox-overlay.active .lightbox-img { transform: scale(1); }

    .lightbox-close, .lightbox-prev, .lightbox-next {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: var(--transition-fast);
      z-index: 10001;
    }
    .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { background: var(--gold-primary); color: var(--bg-base); border-color: var(--gold-primary); }
    
    .lightbox-close { top: 30px; right: 30px; width: 50px; height: 50px; font-size: 1.5rem; }
    .lightbox-next { right: 30px; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; font-size: 1.8rem; }
    .lightbox-prev { left: 30px; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; font-size: 1.8rem; }
    
    .lightbox-counter { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: var(--silver); font-size: 1.1rem; letter-spacing: 2px; }

    @media (max-width: 768px) {
      .lightbox-next, .lightbox-prev { display: none; /* الاعتماد على السحب في الموبايل */ }
    }

    /* =========================================
       5. PRODUCT INFORMATION & SHARE BUTTON
    ========================================= */
    .info-section { display: flex; min-width: 0; flex-direction: column; gap: 20px; }
    
    .info-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .info-brand { color: var(--silver); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    
    .btn-share {
      background: var(--bg-elevated);
      border: 1px solid var(--border-dark);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .btn-share:hover {
      background: var(--gold-primary);
      color: var(--bg-base);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }
    .info-header-actions { display: flex; gap: 8px; }
    .btn-wishlist-detail {
      width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-dark); border-radius: 50%; background: var(--bg-elevated); color: var(--text-main); cursor: pointer;
    }
    .btn-wishlist-detail[aria-pressed="true"] { color: #ff7285; border-color: #ff7285; }
    .wishlist-count[hidden] { display: none !important; }
    .info-title { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 800; color: var(--text-main); line-height: 1.3; margin: 0; }
    
    .info-rating { display: flex; align-items: center; gap: 10px; color: var(--gold-primary); font-size: 1rem; }
    .info-rating span { color: var(--silver); font-size: 0.9rem; }
    
    .info-price-block { display: flex; align-items: flex-end; gap: 15px; margin-top: 10px; border-bottom: 1px solid var(--border-dark); padding-bottom: 25px; }
    .price-current { font-size: 2.5rem; font-weight: 800; color: var(--gold-primary); line-height: 1; }
    .price-old { font-size: 1.2rem; color: var(--text-muted); text-decoration: line-through; margin-bottom: 5px; }
    .badge-discount { background: var(--burgundy); color: #fff; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }

    .info-availability { display: inline-flex; align-items: center; gap: 8px; color: #10B981; font-weight: 600; font-size: 0.95rem; background: rgba(16, 185, 129, 0.1); padding: 8px 16px; border-radius: 50px; width: fit-content; }
    .info-availability.out-of-stock { color: var(--burgundy); background: rgba(128, 0, 32, 0.1); }

    .info-desc { color: var(--silver); font-size: 1.05rem; line-height: 1.8; margin: 0; }
    
    .info-specs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    .info-specs li { display: flex; align-items: center; gap: 10px; color: #d1d5db; font-size: 0.95rem; }
    .info-specs li i { color: var(--gold-primary); font-size: 0.8rem; }

    /* =========================================
       6. ACTIONS & STICKY MOBILE BAR
    ========================================= */
    .actions-block { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
    
    .quantity-selector { display: flex; align-items: center; background: var(--bg-surface); border: 1px solid var(--border-dark); border-radius: var(--radius-md); width: fit-content; overflow: hidden; }
    .qty-btn { background: none; border: none; color: var(--text-main); width: 45px; height: 45px; font-size: 1.2rem; cursor: pointer; transition: var(--transition-fast); }
    .qty-btn:hover { background: var(--bg-elevated); color: var(--gold-primary); }
    .qty-input { background: none; border: none; color: var(--text-main); width: 50px; text-align: center; font-size: 1.1rem; font-weight: 700; font-family: 'Cairo'; pointer-events: none; }

    .buttons-group { display: flex; gap: 15px; }
    .btn-add, .btn-buy { flex: 1; padding: 18px 24px; border-radius: var(--radius-md); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: var(--transition-fast); border: none; }
    
    .btn-add { background: var(--gold-primary); color: var(--bg-base); }
    .btn-add:hover { background: var(--gold-hover); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
    
    .btn-buy { background: var(--bg-surface); border: 1px solid var(--border-dark); color: var(--text-main); }
    .btn-buy:hover { background: var(--bg-elevated); border-color: var(--silver); }

    .delivery-info { background: var(--bg-surface); border: 1px solid var(--border-dark); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
    .delivery-item { display: flex; align-items: flex-start; gap: 15px; }
    .delivery-item i { color: var(--silver); font-size: 1.4rem; margin-top: 2px; }
    .delivery-item-text h4 { margin: 0 0 5px; color: var(--text-main); font-size: 0.95rem; }
    .delivery-item-text p { margin: 0; color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }

    @media (max-width: 992px) {
      .product-detail-page { padding: 12px 0 20px; }
      .product-detail-container { padding: 0 clamp(12px, 4vw, 20px); }
      .product-detail-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .gallery-section { position: static; gap: 10px; }
      .main-image-container {
        width: 100%;
        max-height: min(92vw, 520px);
        aspect-ratio: 1 / 1;
        border-radius: 18px;
        cursor: grab;
      }
      .main-image-container:active { cursor: grabbing; }
      .main-image-wrapper img { width: 86%; height: 86%; filter: drop-shadow(0 12px 20px rgba(0,0,0,.28)); }
      .thumbnails-container { gap: 8px; padding: 2px 1px 5px; }
      .thumbnail-box { width: 64px; height: 64px; padding: 6px; border-radius: 10px; }
      .info-section {
        min-width: 0;
        gap: 14px;
        padding: clamp(14px, 4vw, 20px);
        border: 1px solid var(--border-dark);
        border-radius: 18px;
        background: var(--bg-surface);
      }
      .info-header-row { margin-bottom: 0; }
      .info-brand { font-size: .82rem; letter-spacing: .5px; }
      .info-title { font-size: clamp(1.25rem, 5vw, 1.75rem); line-height: 1.45; overflow-wrap: anywhere; }
      .info-price-block { align-items: flex-end; flex-wrap: wrap; gap: 8px 12px; margin-top: 0; padding-bottom: 16px; }
      .price-current { font-size: clamp(1.7rem, 7vw, 2.2rem); }
      .price-old { font-size: 1rem; }
      .badge-discount { font-size: .75rem; padding: 4px 8px; }
      .info-availability { max-width: 100%; border-radius: 10px; padding: 8px 12px; font-size: .88rem; line-height: 1.55; }
      .info-desc { font-size: .97rem; line-height: 1.75; overflow-wrap: anywhere; }
      .info-specs li { align-items: flex-start; line-height: 1.6; overflow-wrap: anywhere; }
      .actions-block { gap: 14px; margin-top: 0; }
      .delivery-info { padding: 14px; gap: 13px; }
      .delivery-item { gap: 11px; }
      .delivery-item-text { min-width: 0; }
      .delivery-item-text p { line-height: 1.6; overflow-wrap: anywhere; }
      .buttons-group { display: none; /* سيتم نقلها للبار السفلي الملتصق */ }
      .mobile-sticky-actions {
        position: fixed;
        left: 50%;
        right: auto;
        bottom: calc(var(--bakar-nav-height, 70px) + var(--bakar-nav-bottom, 24px) + 10px);
        width: min(620px, calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
        min-height: var(--bakar-product-actions-height, 68px);
        transform: translateX(-50%);
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: 8px 10px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        z-index: 999;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        border: 1px solid var(--border-dark);
        border-radius: 16px;
      }
      .mobile-sticky-actions .btn-add, .mobile-sticky-actions .btn-buy { width: 100%; min-width: 0; min-height: 48px; padding: 10px 8px; flex: none; border-radius: 12px; font-size: clamp(.76rem, 3.6vw, .9rem); white-space: nowrap; gap: 6px; }
    }
    @media (min-width: 993px) { .mobile-sticky-actions { display: none; } }
    @media (max-width: 380px) {
      .product-detail-container { padding-inline: 10px; }
      .info-section { padding: 12px; }
      .info-price-block { gap: 7px 9px; }
      .price-current { font-size: 1.55rem; }
      .mobile-sticky-actions { gap: 7px; padding-inline: 8px; }
      .mobile-sticky-actions .btn-add, .mobile-sticky-actions .btn-buy { padding-inline: 7px; }
    }

    @media (max-width: 992px) {
      body.product-detail-body {
        padding-bottom: calc(var(--bakar-nav-clearance) + var(--bakar-product-actions-height, 68px) + 20px);
      }
      .product-detail-body .toast-container {
        right: max(12px, env(safe-area-inset-right, 0px));
        bottom: calc(var(--bakar-nav-height) + var(--bakar-nav-bottom) + var(--bakar-product-actions-height, 68px) + 24px);
        left: max(12px, env(safe-area-inset-left, 0px));
      }
      .product-detail-body .toast-premium { width: 100%; min-width: 0; }
    }

    /* =========================================
       7. BURGUNDY TOAST NOTIFICATION
    ========================================= */
    .toast-container { position: fixed; bottom: var(--bakar-nav-clearance); left: 20px; z-index: 10001; display: flex; flex-direction: column; gap: 10px; }
    .toast-premium { background: var(--burgundy); color: #fff; border-radius: var(--radius-md); padding: 12px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; min-width: 280px; transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 1px solid rgba(255,255,255,0.1); }
    .toast-premium.show { transform: translateY(0); opacity: 1; }
    .toast-img { width: 45px; height: 45px; background: #fff; border-radius: var(--radius-sm); padding: 3px; object-fit: contain; }
    .toast-text h4 { margin: 0; font-size: 0.9rem; font-weight: 700; }
    .toast-text p { margin: 4px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.8); }

  </style>
  <script>
    (() => {
      let theme = 'light';
      try {
        const savedTheme = localStorage.getItem('bakar-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
      } catch {
        // Keep the light theme if browser storage is unavailable.
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="product-detail-body">

  <!-- Premium Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">ال بكار<span>.</span></a>
      <div class="header-actions">
        <a href="products.html?focus=search" class="icon-btn" aria-label="البحث عن منتج"><i class="fas fa-search"></i></a>
        <a href="wishlist.html" class="icon-btn" aria-label="المفضلة" title="المفضلة"><i class="far fa-heart"></i><span class="cart-badge-premium wishlist-count" hidden>0</span></a>
        <a href="cart.html" class="icon-btn" aria-label="السلة">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-badge-premium cart-count" id="cartCount">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Product Section -->
  <section class="product-detail-page">
    <div class="product-detail-container" id="productDetail">
      <!-- Loading State -->
      <div style="text-align: center; padding: 100px 0; color: var(--silver);">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--gold-primary); margin-bottom: 20px;"></i>
        <h2 style="font-weight: 600;">جاري تجهيز عرض المنتج الفاخر...</h2>
      </div>
    </div>
  </section>

  <!-- Sticky Actions for Mobile -->
  <div class="mobile-sticky-actions" id="mobileActions" style="display: none;">
    <button class="btn-buy" id="mobileWishlistButton" type="button" aria-pressed="false"><i class="far fa-heart"></i> المفضلة</button>
    <button class="btn-add" id="mobileAddBtn">أضف للسلة <i class="fas fa-shopping-bag"></i></button>
  </div>

  <!-- Lightbox Overlay -->
  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose"><i class="fas fa-times"></i></button>
    <button class="lightbox-prev" id="lightboxPrev"><i class="fas fa-chevron-right"></i></button>
    <img src="" alt="Fullscreen Image" class="lightbox-img" id="lightboxImg">
    <button class="lightbox-next" id="lightboxNext"><i class="fas fa-chevron-left"></i></button>
    <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="main.js"></script>
  <script type="module">
    import { logClientError } from './client-logger.js';
    import { getProducts } from './api.js';
    import { getWishlist, isWishlisted, toggleWishlist } from './wishlist.js';
    import { escapeHtml, safeImageUrl } from './html-utils.js';

    const detailContainer = document.getElementById('productDetail');
    const mobileActions = document.getElementById('mobileActions');
    const params = new URLSearchParams(window.location.search);

    function syncMobileActionsVisibility() {
      const productIsLoaded = Boolean(detailContainer.querySelector('.product-detail-layout'));
      mobileActions.style.display = productIsLoaded && window.matchMedia('(max-width: 992px)').matches ? 'grid' : 'none';
    }

    window.addEventListener('resize', syncMobileActionsVisibility, { passive: true });
    window.addEventListener('orientationchange', syncMobileActionsVisibility, { passive: true });
    const productId = params.get('id');
    
    // Global state للمنتج
    window.currentProduct = null;
    window.currentQty = 1;
    window.productImages = [];
    window.currentImageIndex = 0;

    // تحديث مبدئي لعداد السلة
    updateCartBadge();
    updateWishlistBadges();
    window.addEventListener('bakar:wishlist-change', updateWishlistBadges);

    renderProduct();

    async function renderProduct() {
      try {
        if (!productId) throw new Error("لا يوجد معرف منتج.");

        const products = await getProducts([productId]);
        const product = products.find(item => String(item.id) === String(productId));
        if (!product || product.is_active === false || product.isActive === false) {
          renderError('المنتج غير موجود أو لم يعد متاحًا.');
          return;
        }
        window.currentProduct = product;
        const p = window.currentProduct;
        
        document.title = `${p.name} | مؤسسة ال بكار`;
        const productDescription = String(p.description || `تسوق ${p.name} من مؤسسة ال بكار. تعرف على المواصفات والسعر والتوفر واطلب أونلاين.`).replace(/\s+/g, ' ').slice(0, 300);
        const productUrl = new URL(`product.html?id=${encodeURIComponent(String(p.id))}`, window.location.href).href;
        const placeholderImage = safeImageUrl('assets/images/placeholder.svg');
        const productImageCandidates = [
          ...(Array.isArray(p.image_urls) ? p.image_urls : []),
          p.image_url,
          p.image,
          placeholderImage
        ];
        const productImages = [...new Set(productImageCandidates
          .map(image => safeImageUrl(image, ''))
          .filter(Boolean))];
        const productImage = productImages[0] || placeholderImage;
        document.querySelector('meta[name="description"]')?.setAttribute('content', productDescription);
        document.querySelector('meta[property="og:title"]')?.setAttribute('content', document.title);
        document.querySelector('meta[property="og:description"]')?.setAttribute('content', productDescription);
        document.querySelector('meta[property="og:image"]')?.setAttribute('content', productImage);
        document.querySelector('meta[property="og:url"]')?.setAttribute('content', productUrl);
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.append(canonical); }
        canonical.href = productUrl;
        document.querySelector('meta[property="og:type"]')?.setAttribute('content', 'product');
        const productSchema = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          name: String(p.name || 'منتج من مؤسسة ال بكار'),
          description: productDescription,
          image: productImages.length ? productImages : [productImage],
          sku: String(p.id),
          brand: { '@type': 'Brand', name: String(p.brand || p.brand_name || 'ال بكار') },
          offers: {
            '@type': 'Offer',
            url: productUrl,
            priceCurrency: 'EGP',
            price: Number(p.price)
          }
        };
        const stock = p.stock ?? p.quantity ?? p.inventory;
        if (stock !== undefined && stock !== null && Number.isFinite(Number(stock))) {
          productSchema.offers.availability = Number(stock) > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock';
        }
        if (Number.isFinite(productSchema.offers.price) && productSchema.offers.price > 0) {
          let structuredData = document.getElementById('productStructuredData');
          if (!structuredData) { structuredData = document.createElement('script'); structuredData.id = 'productStructuredData'; structuredData.type = 'application/ld+json'; document.head.append(structuredData); }
          structuredData.textContent = JSON.stringify(productSchema).replace(/</g, '\\u003c');
        }

        // معالجة الصور
        window.productImages = productImages.length ? productImages : [placeholderImage];
        
        // بناء HTML
        detailContainer.innerHTML = buildProductHTML(p);
        detailContainer.querySelectorAll('.gallery-section img').forEach(image => {
          image.addEventListener('error', () => {
            if (image.src !== placeholderImage) image.src = placeholderImage;
          });
        });
        detailContainer.querySelectorAll('[data-gallery-index]').forEach(button => {
          button.addEventListener('click', () => window.changeMainImage(Number(button.dataset.galleryIndex)));
        });
        detailContainer.querySelector('[data-share-product]')?.addEventListener('click', () => {
          window.shareProduct(String(p.name || 'منتج من مؤسسة ال بكار'));
        });
        
        // إظهار البار السفلي للموبايل
        syncMobileActionsVisibility();
        document.getElementById('mobileAddBtn').onclick = () => handleAddToCart(document.getElementById('mobileAddBtn'));

        // تفعيل الـ Interactions
        setupInteractions();
        setupWishlistButtons(p);
        
      } catch (error) {
        logClientError('product.details.load_failed', error);
        renderError('تعذر تحميل بيانات المنتج الآن. يرجى التحقق من الاتصال وإعادة المحاولة.');
      }
    }

    function buildProductHTML(p) {
      const discountHTML = (p.old_price && p.old_price > p.price) 
        ? `<div class="badge-discount">وفر ${Math.round(((p.old_price - p.price) / p.old_price) * 100)}%</div>` : '';
      
      const oldPriceHTML = (p.old_price && p.old_price > p.price) 
        ? `<span class="price-old">${Number(p.old_price).toLocaleString('ar-EG')} ج.م</span>` : '';

      const specsHTML = Array.isArray(p.specs) && p.specs.length > 0
        ? `<ul class="info-specs">${p.specs.map(s => `<li><i class="fas fa-check"></i> ${escapeHtml(s)}</li>`).join('')}</ul>` : '';

      const thumbnailsHTML = window.productImages.length > 1 
        ? `<div class="thumbnails-container">
            ${window.productImages.map((img, idx) => `
              <div class="thumbnail-box ${idx === 0 ? 'active' : ''}" onclick="window.changeMainImage(${idx})">
                    <img src="${escapeHtml(img)}" alt="Thumbnail">
              </div>
            `).join('')}
           </div>` : '';
      const galleryCounterHTML = window.productImages.length > 1
        ? `<span class="gallery-counter" id="galleryCounter" role="status" aria-live="polite">١ / ${window.productImages.length.toLocaleString('ar-EG')}</span>`
        : '';
      const galleryPaginationHTML = window.productImages.length > 1
        ? `<div class="gallery-pagination" role="group" aria-label="التنقل بين صور المنتج">
            ${window.productImages.map((_, idx) => `<button type="button" class="gallery-dot ${idx === 0 ? 'active' : ''}" data-gallery-index="${idx}" aria-label="عرض الصورة ${idx + 1}" aria-pressed="${idx === 0}"></button>`).join('')}
           </div>`
        : '';

      // تم التعديل هنا لإضافة زر المشاركة
      return `
        <div class="product-detail-layout">
          <!-- الجانب الأيمن: معرض الصور -->
          <div class="gallery-section">
            <div class="main-image-container" id="mainImageContainer">
              <div class="main-image-wrapper" id="mainImageWrapper">
                <img src="${escapeHtml(window.productImages[0])}" id="mainProductImage" alt="${escapeHtml(p.name)}" draggable="false">
              </div>
              ${galleryCounterHTML}
            </div>
            ${galleryPaginationHTML}
            ${thumbnailsHTML}
          </div>

          <!-- الجانب الأيسر: المعلومات -->
          <div class="info-section">
            <div class="info-header-row">
              <div class="info-brand">${escapeHtml(p.brand || 'ال بكار')}</div>
              <div class="info-header-actions">
                <button class="btn-wishlist-detail" type="button" data-product-wishlist aria-label="أضف للمفضلة" title="أضف للمفضلة"><i class="far fa-heart" aria-hidden="true"></i></button>
                <button class="btn-share" type="button" data-share-product title="مشاركة رابط المنتج" aria-label="مشاركة رابط المنتج">
                  <i class="fas fa-share-alt"></i>
                </button>
              </div>
            </div>
            <h1 class="info-title">${escapeHtml(p.name)}</h1>
            
            <div class="info-price-block">
              <div style="display:flex; flex-direction:column;">
                ${oldPriceHTML}
                <div style="display:flex; align-items:center; gap:15px;">
                  <span class="price-current">${Number(p.price).toLocaleString('ar-EG')} ج.م</span>
                  ${discountHTML}
                </div>
              </div>
            </div>

            <div class="info-availability ${p.stock === 0 ? 'out-of-stock' : ''}">
              <i class="fas ${p.stock === 0 ? 'fa-times-circle' : 'fa-check-circle'}"></i> 
              ${p.stock === 0 ? 'نفذت الكمية' : 'متوفر في المخزون وجاهز للشحن'}
            </div>

            <p class="info-desc">${escapeHtml(p.description || 'تصميم عصري وأداء فائق يلبي كافة احتياجات منزلك الذكي بأعلى معايير الجودة والرفاهية.')}</p>
            
            ${specsHTML}

            <div class="actions-block">
              <span style="color: var(--silver); font-size: 0.9rem;">الكمية:</span>
              <div class="quantity-selector">
                <button class="qty-btn" onclick="window.updateQty(1)"><i class="fas fa-plus"></i></button>
                <input type="text" class="qty-input" id="qtyInput" value="1" readonly>
                <button class="qty-btn" onclick="window.updateQty(-1)"><i class="fas fa-minus"></i></button>
              </div>

              <div class="buttons-group">
                <button class="btn-add" id="desktopAddBtn" onclick="window.handleAddToCart(this)">
                  أضف للسلة <i class="fas fa-shopping-bag"></i>
                </button>
              </div>
            </div>

            <div class="delivery-info">
              <div class="delivery-item">
                <i class="fas fa-truck"></i>
                <div class="delivery-item-text">
                  <h4>شحن سريع وموثوق</h4>
                  <p>التوصيل متاح للقاهرة والجيزة فقط. رسوم وموعد التوصيل يظهران عند تأكيد الطلب.</p>
                </div>
              </div>
              <div class="delivery-item">
                <i class="fas fa-shield-alt"></i>
                <div class="delivery-item-text">
                  <h4>تفاصيل الضمان</h4>
                  <p>مدة وجهة الضمان حسب شهادة المنتج. <a href="policies.html#warranty" style="color:var(--gold-primary)">تفاصيل السياسة</a></p>
                </div>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function setupWishlistButtons(product) {
      const buttons = [...document.querySelectorAll('[data-product-wishlist], #mobileWishlistButton')];
      const saved = isWishlisted(product.id);
      buttons.forEach(button => {
        button.setAttribute('aria-pressed', String(saved));
        button.setAttribute('aria-label', saved ? 'إزالة من المفضلة' : 'أضف للمفضلة');
        button.title = saved ? 'إزالة من المفضلة' : 'أضف للمفضلة';
        const icon = button.querySelector('i');
        if (icon) icon.className = `${saved ? 'fas' : 'far'} fa-heart`;
        button.onclick = () => {
          try {
            const nextSaved = toggleWishlist(product.id);
            buttons.forEach(item => {
              item.setAttribute('aria-pressed', String(nextSaved));
              item.setAttribute('aria-label', nextSaved ? 'إزالة من المفضلة' : 'أضف للمفضلة');
              item.title = nextSaved ? 'إزالة من المفضلة' : 'أضف للمفضلة';
              const itemIcon = item.querySelector('i');
              if (itemIcon) itemIcon.className = `${nextSaved ? 'fas' : 'far'} fa-heart`;
            });
            showPremiumToast(window.productImages[0], product.name, nextSaved ? 'أضيف المنتج للمفضلة' : 'أزيل المنتج من المفضلة');
          } catch {
            window.alert('تعذر تحديث المفضلة على هذا الجهاز.');
          }
        };
      });
    }

    function updateWishlistBadges() {
      const count = getWishlist().length;
      document.querySelectorAll('.wishlist-count').forEach(badge => {
        badge.textContent = count.toLocaleString('ar-EG');
        badge.hidden = count === 0;
      });
    }

    function bindTouchSwipe(target, onSwipe) {
      let startPoint = null;
      target.addEventListener('touchstart', event => {
        if (event.touches.length !== 1) {
          startPoint = null;
          return;
        }
        const touch = event.touches[0];
        startPoint = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      target.addEventListener('touchend', event => {
        if (!startPoint || event.changedTouches.length !== 1) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - startPoint.x;
        const deltaY = touch.clientY - startPoint.y;
        startPoint = null;
        if (Math.abs(deltaX) < 42 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
        onSwipe(deltaX < 0 ? 1 : -1);
      }, { passive: true });
    }

    function setupInteractions() {
      // 1. 3D Hover Effect for Desktop Main Image
      const container = document.getElementById('mainImageContainer');
      const wrapper = document.getElementById('mainImageWrapper');
      
      if(window.innerWidth > 992 && container && wrapper) {
        container.addEventListener('mousemove', (e) => {
          const rect = container.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -8;
          const rotateY = ((x - centerX) / centerX) * 8;
          
          wrapper.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        
        container.addEventListener('mouseleave', () => {
          wrapper.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
      }

      // 2. Lightbox Logic
      const mainImg = document.getElementById('mainProductImage');
      const lightbox = document.getElementById('lightboxOverlay');
      const lbImg = document.getElementById('lightboxImg');
      let suppressGalleryClickUntil = 0;

      bindTouchSwipe(container, direction => {
        suppressGalleryClickUntil = Date.now() + 450;
        window.changeMainImage((window.currentImageIndex + direction + window.productImages.length) % window.productImages.length);
      });
      bindTouchSwipe(lightbox, direction => {
        window.changeMainImage((window.currentImageIndex + direction + window.productImages.length) % window.productImages.length);
      });
      
      container.addEventListener('click', () => {
        if (Date.now() < suppressGalleryClickUntil) return;
        lbImg.src = window.productImages[window.currentImageIndex];
        updateLightboxCounter();
        lightbox.classList.add('active');
      });

      document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('active'));
      document.getElementById('lightboxNext').addEventListener('click', () => window.changeMainImage((window.currentImageIndex - 1 + window.productImages.length) % window.productImages.length));
      document.getElementById('lightboxPrev').addEventListener('click', () => window.changeMainImage((window.currentImageIndex + 1) % window.productImages.length));
      
      // إغلاق عند الضغط بالخارج
      lightbox.addEventListener('click', (e) => { if(e.target === lightbox) lightbox.classList.remove('active'); });
      document.addEventListener('keydown', event => {
        if (!lightbox.classList.contains('active')) return;
        if (event.key === 'Escape') lightbox.classList.remove('active');
        if (event.key === 'ArrowLeft') window.changeMainImage((window.currentImageIndex + 1) % window.productImages.length);
        if (event.key === 'ArrowRight') window.changeMainImage((window.currentImageIndex - 1 + window.productImages.length) % window.productImages.length);
      });
    }

    // Global Functions for UI Events
    window.changeMainImage = function(index) {
      const imageCount = window.productImages.length;
      if (!imageCount) return;
      index = (Number(index) % imageCount + imageCount) % imageCount;
      if(index === window.currentImageIndex) return;
      window.currentImageIndex = index;
      
      const mainImg = document.getElementById('mainProductImage');
      const lbImg = document.getElementById('lightboxImg');
      const thumbs = document.querySelectorAll('.thumbnail-box');
      const dots = document.querySelectorAll('.gallery-dot');

      // Fade Transition
      mainImg.style.opacity = '0';
      setTimeout(() => {
        mainImg.src = window.productImages[index];
        if(lbImg) lbImg.src = window.productImages[index];
        mainImg.style.opacity = '1';
      }, 200);

      // Update Thumbnails styling
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === index);
        t.setAttribute('aria-current', String(i === index));
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
        dot.setAttribute('aria-pressed', String(i === index));
      });

      const activeThumb = thumbs[index];
      activeThumb?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      const galleryCounter = document.getElementById('galleryCounter');
      if (galleryCounter) galleryCounter.textContent = `${(index + 1).toLocaleString('ar-EG')} / ${imageCount.toLocaleString('ar-EG')}`;

      updateLightboxCounter();
    };

    function updateLightboxCounter() {
      const counter = document.getElementById('lightboxCounter');
      if(counter) counter.textContent = `${window.currentImageIndex + 1} / ${window.productImages.length}`;
    }

    window.updateQty = function(change) {
      const input = document.getElementById('qtyInput');
      let newQty = window.currentQty + change;
      if(newQty >= 1) {
        window.currentQty = newQty;
        input.value = newQty;
      }
    };

    // =========================================
    // وظيفة مشاركة المنتج الجديدة
    // =========================================
    window.shareProduct = async function(productName) {
      const shareData = {
        title: `${productName} | ال بكار للأجهزة الفاخرة`,
        text: `شاهد هذا المنتج الفاخر من مؤسسة ال بكار: ${productName}`,
        url: window.location.href // يجلب الرابط الحالي تلقائياً
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(window.location.href);
        showPremiumToast(window.productImages[0], productName, 'تم نسخ رابط المنتج للمشاركة!');
      } catch {
        window.prompt('انسخ رابط المنتج لمشاركته:', window.location.href);
      }
    };

    window.handleAddToCart = function(btn) {
      const p = window.currentProduct;
      if(!p) return;
      if (!Number.isFinite(Number(p.price)) || Number(p.price) <= 0) {
        window.alert('لا يمكن إضافة المنتج قبل تحديد سعره.');
        return;
      }

      // Loading Animation on Button
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإضافة...';
      btn.style.pointerEvents = 'none';

      setTimeout(() => {
        // Logic لإضافة المنتج للـ localStorage بدون Reload
        try {
          const data = localStorage.getItem('bakar_cart');
          let cart = data ? JSON.parse(data) : [];
          const existingIndex = cart.findIndex(item => String(item.id) === String(p.id));
          
          if (existingIndex > -1) {
            cart[existingIndex].qty = (parseInt(cart[existingIndex].qty) || 1) + window.currentQty;
          } else {
            cart.push({ id: String(p.id), name: String(p.name), price: parseFloat(p.price), image: window.productImages[0], qty: window.currentQty });
          }
          
          localStorage.setItem('bakar_cart', JSON.stringify(cart));
          updateCartBadge();
          
          // Show Premium Burgundy Toast (مع تمرير العنوان الفرعي للإشعار)
          showPremiumToast(window.productImages[0], p.name, `تمت إضافة ${window.currentQty} للسلة`);
          
        } catch(e) {
          logClientError('product.cart.add_failed', e);
        }

        // Reset Button
        btn.innerHTML = '<i class="fas fa-check"></i> تمت الإضافة';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.pointerEvents = 'auto';
          window.currentQty = 1; // reset visual qty
          document.getElementById('qtyInput').value = 1;
        }, 2000);
      }, 400); // محاكاة وقت التحميل للفخامة
    };

    function updateCartBadge() {
      try {
        const data = localStorage.getItem('bakar_cart');
        const cart = data ? JSON.parse(data) : [];
        const totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 1), 0);
        document.querySelectorAll('.cart-count').forEach(el => {
          el.textContent = totalQty;
          el.style.transform = 'scale(1.3)';
          setTimeout(() => el.style.transform = 'scale(1)', 200);
        });
      } catch(e) {}
    }

    // تعديل الدالة لتقبل العنوان الفرعي (Subtitle) عشان تنفع في المشاركة والإضافة للسلة
    function showPremiumToast(imgSrc, title, subtitle) {
      const container = document.getElementById('toastContainer');
      if(!container) return;

      const toast = document.createElement('div');
      toast.className = 'toast-premium';
      toast.innerHTML = `
        <img src="${escapeHtml(safeImageUrl(imgSrc))}" class="toast-img" alt="Notification">
        <div class="toast-text">
          <h4>${escapeHtml(subtitle)}</h4>
          <p>${escapeHtml(title)}</p>
        </div>
      `;
      
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    function renderError(msg) {
      detailContainer.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 100px 20px;">
          <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--burgundy); margin-bottom: 20px;"></i>
          <h2 style="color: var(--text-main); font-weight: 700; margin-bottom: 20px;">${escapeHtml(msg)}</h2>
